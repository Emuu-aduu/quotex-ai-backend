<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="High-Performance Standalone TradingView Signal Monitor">
  <meta name="theme-color" content="#0f172a">

  <title>TradingView Signal Engine</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Apple Mobile Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SignalEngine">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .spinner {
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Flutter Web Engine Loader -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>TradingView Signal Dashboard লোড হচ্ছে...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Initialize Flutter/Flet Web Application Engine
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(app) {
            app.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
